<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国語｜表現技法まとめ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:   #0d1117;
  --bg2:  #161b22;
  --bg3:  #1c2230;
  --gold: #f5c518;
  --red:  #e94560;
  --teal: #0ea5e9;
  --green:#3fb950;
  --purple:#a371f7;
  --text: #e6edf3;
  --text2:#8b949e;
  --border:#30363d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  line-height: 2.0;
  letter-spacing: 0.04em;
}
.top-nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--purple); letter-spacing: 2px; flex-shrink: 0; }
.ref-main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
.ref-intro { background: var(--bg2); border: 1px solid var(--border); border-left: 4px solid var(--purple); border-radius: 12px; padding: 18px 20px; margin-bottom: 26px; font-size: 14px; line-height: 2.0; color: var(--text2); }
.ref-section-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); letter-spacing: 1.5px; margin: 32px 0 14px; }
.ref-section-title:first-of-type { margin-top: 0; }
.acc-lead { font-size: 13px; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }

.rule-box { background: var(--bg3); border-left: 3px solid var(--purple); padding: 16px 18px; border-radius: 8px; margin-bottom: 14px; font-size: 15px; line-height: 2.1; }
.rule-box .rule-title { font-weight: bold; color: var(--purple); font-size: 13px; margin-bottom: 8px; }
.rule-box .ex   { color: var(--gold); font-size: 15px; margin-bottom: 4px; }
.rule-box .note { font-size: 12px; color: var(--text2); padding: 6px 10px; background: rgba(163,113,247,0.08); border-radius: 6px; margin-top: 6px; }

.q-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 22px 20px; margin-bottom: 16px; transition: border-color 0.2s; }
.q-card.correct-card { border-color: var(--green); }
.q-card.wrong-card   { border-color: var(--red); }
.q-number { font-size: 11px; color: var(--text2); margin-bottom: 6px; letter-spacing: 1px; }
.q-text   { font-size: 17px; line-height: 2.0; margin-bottom: 6px; letter-spacing: 0.04em; }
.q-sub    { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.8; }
.choices  { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.choice-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 15px; font-family: inherit; transition: all 0.2s; }
.choice-btn:hover            { border-color: var(--purple); color: var(--purple); }
.choice-btn.selected-correct { background: rgba(63,185,80,0.15); border-color: var(--green); color: var(--green); }
.choice-btn.selected-wrong   { background: rgba(233,69,96,0.15); border-color: var(--red); color: var(--red); animation: shake 0.3s; }
.choice-btn.show-correct     { background: rgba(63,185,80,0.15); border-color: var(--green); color: var(--green); }
.choice-btn:disabled         { cursor: default; }
@keyframes shake { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.q-feedback { display: none; margin-top: 12px; padding: 14px 16px; border-radius: 8px; font-size: 14px; line-height: 2.0; }
.q-feedback.correct-fb { background: rgba(63,185,80,0.08); border-left: 3px solid var(--green); color: var(--green); }
.q-feedback.wrong-fb   { background: rgba(233,69,96,0.08); border-left: 3px solid var(--red); color: #f87171; }

.print-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; border: none; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-family: inherit; font-weight: bold; cursor: pointer; letter-spacing: 0.5px; }
.print-btn:hover { opacity: 0.88; }
.ref-actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0; align-items: center; }

@media print {
  body { background: #fff !important; color: #111 !important; }
  .top-nav, .print-btn, .ref-actions { display: none !important; }
  .ref-intro { background: #f3f3f3 !important; color: #333 !important; border-color: #ccc !important; }
  .rule-box, .q-card { background: #fff !important; border-color: #999 !important; }
  .ref-section-title { color: #111 !important; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-title">🐕 表現技法まとめ</div>
</nav>

<div class="ref-main" id="refMain"></div>

<script>
var GIHOU_LIST = [
  { name:'直喩（明喩）', color:'#f5c518',
    desc:'「ようだ・みたいだ・ごとし」などの言葉を使って、はっきりとたとえる。',
    ex:'あの犬は、まるで小さな熊のようだ。',
    tip:'「ようだ」「みたいだ」「ごとし」などの言葉が目印。' },
  { name:'隠喩（暗喩）', color:'#a371f7',
    desc:'「ようだ」などを使わず、直接たとえる。',
    ex:'あの犬は、我が家の小さな王様だ。',
    tip:'たとえの言葉がないぶん、直喩より気づきにくい。「AはBだ」の形になっていないか確認しよう。' },
  { name:'擬人法', color:'#3fb950',
    desc:'人でないもの（動物・物・自然など）を、人であるかのように表現する。',
    ex:'あの犬が「待って」と言うように、こちらを見つめた。',
    tip:'動物や物が、人間だけができる動作・感情を持つように描かれていたら擬人法。' },
  { name:'体言止め', color:'#0ea5e9',
    desc:'文の終わりを名詞（体言）で止めて、余韻を残す。',
    ex:'静かにそこにいる、あの犬。',
    tip:'文末が「〜だ」「〜する」ではなく、名詞でぷつっと終わっている。' },
  { name:'倒置法', color:'#e94560',
    desc:'ふつうの語順をわざと入れ替えて、意味を強調する。',
    ex:'とても静かだ、あの犬は。',
    tip:'本来の語順は「あの犬はとても静かだ」。入れ替えることで強調したい部分が前に来る。' },
  { name:'反復法', color:'#f97316',
    desc:'同じ言葉や似た言葉を繰り返して、強調する。',
    ex:'歩かない、歩かない、あの犬は。',
    tip:'同じ言葉が2回以上繰り返されていたら反復法。リズムと強さが生まれる。' },
  { name:'対句', color:'#84cc16',
    desc:'形や意味が対になる言葉を並べて表現する。',
    ex:'走る猫、歩かぬ犬。',
    tip:'似た組み立ての言葉が、左右で対応するように並んでいる。' },
  { name:'省略法', color:'#8b8b8b',
    desc:'言葉の一部をあえて省いて、想像の余地を残す。',
    ex:'あの犬、とても……。',
    tip:'文が最後まで言い切られておらず、読み手に続きを想像させる。' },
];

var GIHOU_QUIZ = [
  { s:'静かにそこにいる、あの犬。', answer:'体言止め', exp:'文末が名詞「あの犬」で終わっている。' },
  { s:'あの犬は、まるで小さな熊のようだ。', answer:'直喩（明喩）', exp:'「ようだ」を使ってはっきりたとえている。' },
  { s:'とても静かだ、あの犬は。', answer:'倒置法', exp:'本来の語順「あの犬はとても静かだ」が入れ替わっている。' },
  { s:'あの犬が「待って」と言うように、こちらを見つめた。', answer:'擬人法', exp:'犬が人間のように「言う」動作をするように描かれている。' },
  { s:'歩かない、歩かない、あの犬は。', answer:'反復法', exp:'「歩かない」が繰り返されている。' },
  { s:'走る猫、歩かぬ犬。', answer:'対句', exp:'「走る猫」と「歩かぬ犬」が対になる形で並んでいる。' },
  { s:'あの犬は、我が家の小さな王様だ。', answer:'隠喩（暗喩）', exp:'「ようだ」を使わず、直接「王様だ」とたとえている。' },
];

function renderGihouCards() {
  return GIHOU_LIST.map(function(g) {
    return '<div class="rule-box" style="border-left-color:' + g.color + ';">'
      + '<div class="rule-title" style="color:' + g.color + ';">' + g.name + '</div>'
      + '<div>' + g.desc + '</div>'
      + '<div class="ex">🐕 ' + g.ex + '</div>'
      + '<div class="note">' + g.tip + '</div>'
      + '</div>';
  }).join('');
}

function shuffleChoices(list, correct) {
  var wrong = list.filter(function(n) { return n !== correct; });
  var picks = [];
  while (picks.length < 2 && wrong.length) {
    var idx = Math.floor(Math.random() * wrong.length);
    picks.push(wrong.splice(idx, 1)[0]);
  }
  var choices = picks.concat([correct]);
  for (var i = choices.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = choices[i]; choices[i] = choices[j]; choices[j] = tmp;
  }
  return choices;
}

var GIHOU_QUIZ_CHOICES = [];

function renderGihouQuiz() {
  var names = GIHOU_LIST.map(function(g) { return g.name; });
  var cards = GIHOU_QUIZ.map(function(item, i) {
    var choices = shuffleChoices(names, item.answer);
    GIHOU_QUIZ_CHOICES[i] = choices;
    var choiceHtml = choices.map(function(c, ci) {
      return '<button class="choice-btn" data-qi="' + i + '" data-ci="' + ci + '">' + c + '</button>';
    }).join('');
    return '<div class="q-card" id="gq-card-' + i + '">'
      + '<div class="q-number">Q' + (i + 1) + '</div>'
      + '<div class="q-text">「' + item.s + '」</div>'
      + '<div class="q-sub">この文で使われている表現技法はどれ？</div>'
      + '<div class="choices" id="gq-choices-' + i + '">' + choiceHtml + '</div>'
      + '<div class="q-feedback" id="gq-fb-' + i + '"></div>'
      + '</div>';
  }).join('');
  return '<div class="acc-lead">🎯 答えを選ぶとすぐに正解と解説が出るよ。点数はつかないので、気軽に確認しよう。</div>' + cards;
}

function wireGihouQuiz() {
  document.querySelectorAll('.choice-btn[data-qi]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var qi = parseInt(btn.dataset.qi);
      var ci = parseInt(btn.dataset.ci);
      var item = GIHOU_QUIZ[qi];
      var choices = GIHOU_QUIZ_CHOICES[qi];
      var choicesWrap = document.getElementById('gq-choices-' + qi);
      var fb = document.getElementById('gq-fb-' + qi);
      var card = document.getElementById('gq-card-' + qi);
      if (choicesWrap.dataset.answered) return;
      choicesWrap.dataset.answered = '1';
      var answerIdx = choices.indexOf(item.answer);
      choicesWrap.querySelectorAll('.choice-btn').forEach(function(b, i) {
        b.disabled = true;
        if (i === answerIdx) b.classList.add('show-correct');
      });
      var correct = ci === answerIdx;
      if (correct) { btn.classList.add('selected-correct'); card.classList.add('correct-card'); }
      else { btn.classList.add('selected-wrong'); card.classList.add('wrong-card'); }
      fb.className = 'q-feedback ' + (correct ? 'correct-fb' : 'wrong-fb');
      fb.style.display = 'block';
      fb.textContent = (correct ? '◎ 正解！ ' : '✗ 惜しい。正解は「' + item.answer + '」。') + item.exp;
    });
  });
}

function render() {
  var html = '<div class="ref-intro">🐕 詩や小説、随筆でよく使われる「表現技法」を、品詞早見表・古文まとめと同じ「あの犬」の例文で1つずつ見比べられるようにした。</div>';

  html += '<div class="ref-section-title">① 表現技法ひとめカード</div>';
  html += renderGihouCards();

  html += '<div class="ref-section-title">② かんたん問題</div>';
  html += renderGihouQuiz();

  html += '<div class="ref-actions">'
    + '<button class="print-btn" id="printBtn">🖨️ 印刷してデスクに貼る</button>'
    + '</div>';

  document.getElementById('refMain').innerHTML = html;

  wireGihouQuiz();

  var pb = document.getElementById('printBtn');
  if (pb) pb.addEventListener('click', function() { window.print(); });
}

render();
</script>
</body>
</html>
