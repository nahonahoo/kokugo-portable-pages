<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国語｜変格活用まとめ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:   #0d1117;
  --bg2:  #161b22;
  --bg3:  #1c2230;
  --gold: #f5c518;
  --red:  #e94560;
  --teal: #0ea5e9;
  --green:#3fb950;
  --purple:#a371f7;
  --text: #e6edf3;
  --text2:#8b949e;
  --border:#30363d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  line-height: 2.0;
  letter-spacing: 0.04em;
}
.top-nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--purple); letter-spacing: 2px; flex-shrink: 0; }
.ref-main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
.ref-intro { background: var(--bg2); border: 1px solid var(--border); border-left: 4px solid var(--purple); border-radius: 12px; padding: 18px 20px; margin-bottom: 26px; font-size: 14px; line-height: 2.0; color: var(--text2); }
.ref-section-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); letter-spacing: 1.5px; margin: 32px 0 14px; }
.ref-section-title:first-of-type { margin-top: 0; }
.acc-lead { font-size: 13px; color: var(--text2); line-height: 1.9; margin-bottom: 14px; }

.rule-box { background: var(--bg3); border-left: 3px solid var(--purple); padding: 16px 18px; border-radius: 8px; margin-bottom: 14px; font-size: 15px; line-height: 2.1; }
.rule-box .rule-title { font-weight: bold; color: var(--purple); font-size: 13px; margin-bottom: 8px; }
.rule-box .ex   { color: var(--gold); font-size: 15px; margin-bottom: 4px; }
.rule-box .note { font-size: 12px; color: var(--text2); padding: 6px 10px; background: rgba(163,113,247,0.08); border-radius: 6px; margin-top: 6px; }

.kobu-table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; }
.kobu-table { width: 100%; border-collapse: collapse; min-width: 420px; background: var(--bg3); font-size: 14px; }
.kobu-table th { background: #11151c; color: var(--text2); font-size: 11px; padding: 8px 12px; text-align: left; border-bottom: 2px solid var(--border); white-space: nowrap; }
.kobu-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); line-height: 1.9; vertical-align: top; }
.kobu-table tr:last-child td { border-bottom: none; }
.kobu-word { color: var(--gold); font-weight: bold; white-space: nowrap; }

.q-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 22px 20px; margin-bottom: 16px; transition: border-color 0.2s; }
.q-card.correct-card { border-color: var(--green); }
.q-card.wrong-card   { border-color: var(--red); }
.q-number { font-size: 11px; color: var(--text2); margin-bottom: 6px; letter-spacing: 1px; }
.q-text   { font-size: 17px; line-height: 2.0; margin-bottom: 6px; letter-spacing: 0.04em; }
.q-sub    { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.8; }
.choices  { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.choice-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 15px; font-family: inherit; transition: all 0.2s; }
.choice-btn:hover            { border-color: var(--purple); color: var(--purple); }
.choice-btn.selected-correct { background: rgba(63,185,80,0.15); border-color: var(--green); color: var(--green); }
.choice-btn.selected-wrong   { background: rgba(233,69,96,0.15); border-color: var(--red); color: var(--red); animation: shake 0.3s; }
.choice-btn.show-correct     { background: rgba(63,185,80,0.15); border-color: var(--green); color: var(--green); }
.choice-btn:disabled         { cursor: default; }
@keyframes shake { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.q-feedback { display: none; margin-top: 12px; padding: 14px 16px; border-radius: 8px; font-size: 14px; line-height: 2.0; }
.q-feedback.correct-fb { background: rgba(63,185,80,0.08); border-left: 3px solid var(--green); color: var(--green); }
.q-feedback.wrong-fb   { background: rgba(233,69,96,0.08); border-left: 3px solid var(--red); color: #f87171; }

.print-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; border: none; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-family: inherit; font-weight: bold; cursor: pointer; letter-spacing: 0.5px; }
.print-btn:hover { opacity: 0.88; }
.ref-actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0; align-items: center; }
.back-link { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--text2); text-decoration: none; border-bottom: 1px dashed var(--text2); }
.back-link:hover { color: var(--purple); border-color: var(--purple); }

@media print {
  body { background: #fff !important; color: #111 !important; }
  .top-nav, .print-btn, .ref-actions, .back-link { display: none !important; }
  .ref-intro { background: #f3f3f3 !important; color: #333 !important; border-color: #ccc !important; }
  .kobu-table-wrap, .kobu-table, .rule-box, .q-card { background: #fff !important; border-color: #999 !important; }
  .kobu-table th { background: #eee !important; color: #333 !important; }
  .kobu-table td { color: #111 !important; }
  .kobu-word, .ref-section-title { color: #111 !important; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-title">🐾 変格活用まとめ</div>
</nav>

<div class="ref-main" id="refMain"></div>

<script>
// ----- ① 変格活用ひとめ表 -----
var HENKAKU_TABLE = [
  { type:'カ変', word:'来（く）', mizen:'こ', renyou:'き', shushi:'く', rentai:'くる', izen:'くれ', meirei:'こ（よ）' },
  { type:'サ変', word:'す・おはす など', mizen:'せ', renyou:'し', shushi:'す', rentai:'する', izen:'すれ', meirei:'せよ' },
  { type:'ナ変', word:'死ぬ・往ぬ（去ぬ）', mizen:'な', renyou:'に', shushi:'ぬ', rentai:'ぬる', izen:'ぬれ', meirei:'ね' },
  { type:'ラ変', word:'あり・をり・はべり・いまそかり', mizen:'ら', renyou:'り', shushi:'り', rentai:'る', izen:'れ', meirei:'れ' },
];

var HENKAKU_DOG = [
  { type:'カ変（来）', color:'#a371f7', rows:[
    { form:'未然形＋ず', cls:'犬、来ず。', j:'犬が来ない。' },
    { form:'連用形＋たり', cls:'犬、来たり。', j:'犬が来た。' },
    { form:'終止形（言い切り）', cls:'犬、来。', j:'犬が来る。' },
    { form:'連体形＋時', cls:'犬、来る時。', j:'犬が来る時。' },
    { form:'已然形＋ば', cls:'犬、来れば。', j:'犬が来ると。' },
    { form:'命令形', cls:'疾く来。', j:'早く来い。' },
  ]},
  { type:'サ変（す）', color:'#f5c518', rows:[
    { form:'未然形＋ず', cls:'犬、鳴くまねせず。', j:'犬が鳴くまねをしない。' },
    { form:'連用形＋たり', cls:'犬、鳴くまねしたり。', j:'犬が鳴くまねをした。' },
    { form:'終止形（言い切り）', cls:'犬、鳴くまねす。', j:'犬が鳴くまねをする。' },
    { form:'連体形＋時', cls:'犬、鳴くまねする時。', j:'犬が鳴くまねをする時。' },
    { form:'已然形＋ば', cls:'犬、鳴くまねすれば。', j:'犬が鳴くまねをすると。' },
    { form:'命令形', cls:'疾く鳴くまねせよ。', j:'早く鳴くまねをしろ。' },
  ]},
  { type:'ナ変（往ぬ）', color:'#3fb950', rows:[
    { form:'未然形＋ず', cls:'犬、往なず。', j:'犬が行ってしまわない。' },
    { form:'連用形＋たり', cls:'犬、往にたり。', j:'犬は行ってしまった。' },
    { form:'終止形（言い切り）', cls:'犬、往ぬ。', j:'犬は行ってしまう。' },
    { form:'連体形＋時', cls:'犬、往ぬる時。', j:'犬が行ってしまう時。' },
    { form:'已然形＋ば', cls:'犬、往ぬれば。', j:'犬が行ってしまうと。' },
    { form:'命令形', cls:'疾く往ね。', j:'早く行ってしまえ。' },
  ]},
  { type:'ラ変（あり）', color:'#0ea5e9', rows:[
    { form:'未然形＋ば（仮定）', cls:'犬あらば。', j:'もし犬がいたら。' },
    { form:'連用形＋けり', cls:'犬ありけり。', j:'犬がいたのだった。' },
    { form:'終止形（言い切り）', cls:'犬、あり。', j:'犬がいる。' },
    { form:'連体形＋時', cls:'犬ある時。', j:'犬がいる時。' },
    { form:'已然形＋ば', cls:'犬あれば。', j:'犬がいるので。' },
    { form:'命令形', cls:'ここにあれ。', j:'ここにいろ。' },
  ]},
];

var HENKAKU_QUIZ = [
  { q:'「来（く）」の活用の種類は？', choices:['サ変','カ変','ナ変'], answer:1, exp:'変格活用の中で「来」だけがカ変。それ以外の言葉はカ変にならない。' },
  { q:'「死ぬ」の活用の種類は？', choices:['ナ変','ラ変','サ変'], answer:0, exp:'ナ変は「死ぬ」「往ぬ（去ぬ）」の2語だけ。' },
  { q:'「あり」の已然形は？', choices:['あら','あり','あれ'], answer:2, exp:'ラ変（あり・をり・はべり・いまそかり）は「ら・り・り・る・れ・れ」の形。已然形は「あれ」。' },
  { q:'「す」の連体形は？', choices:['する','す','すれ'], answer:0, exp:'サ変は「せ・し・す・する・すれ・せよ」の形。連体形は「する」。' },
  { q:'次のうちラ変にあてはまる語はどれ？', choices:['来','をり','死ぬ'], answer:1, exp:'「をり」はラ変（あり・をり・はべり・いまそかり）の仲間。' },
  { q:'「往ぬ」の命令形は？', choices:['往に','往ぬ','往ね'], answer:2, exp:'ナ変は「な・に・ぬ・ぬる・ぬれ・ね」の形。命令形は「ね」。' },
];

function renderHenkakuTable() {
  var rows = HENKAKU_TABLE.map(function(r) {
    return '<tr>'
      + '<td class="kobu-word">' + r.type + '</td>'
      + '<td>' + r.word + '</td>'
      + '<td>' + r.mizen + '</td><td>' + r.renyou + '</td><td>' + r.shushi + '</td>'
      + '<td>' + r.rentai + '</td><td>' + r.izen + '</td><td>' + r.meirei + '</td>'
      + '</tr>';
  }).join('');
  return '<div class="kobu-table-wrap"><table class="kobu-table">'
    + '<thead><tr><th>種類</th><th>あてはまる語</th><th>未然</th><th>連用</th><th>終止</th><th>連体</th><th>已然</th><th>命令</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';
}

function renderHenkakuMnemonic() {
  return '<div class="rule-box">'
    + '<div class="rule-title">変格活用は、全部で9語（＋複合語）しかない</div>'
    + '<div>来（カ変・1語）／す・おはす（サ変）／死ぬ・往ぬ（ナ変・2語）／あり・をり・はべり・いまそかり（ラ変・4語）</div>'
    + '<div class="note">この9語だけを丸ごと覚えてしまえば、あとの動詞はすべて四段・上一段・下一段・上二段・下二段のどれかに必ず当てはまる。「見たことがない特別な形」が出てきたら、まずこの9語を疑おう。</div>'
    + '</div>';
}

function renderHenkakuDog() {
  return HENKAKU_DOG.map(function(g) {
    var rows = g.rows.map(function(r) {
      return '<tr><td style="font-size:12px;color:#8b949e;white-space:nowrap;">' + r.form + '</td><td class="kobu-word">' + r.cls + '</td><td style="color:#8b949e;font-size:13px;">' + r.j + '</td></tr>';
    }).join('');
    return '<div style="font-size:14px;color:' + g.color + ';font-weight:bold;margin:18px 0 8px;">🐕 ' + g.type + '</div>'
      + '<div class="kobu-table-wrap"><table class="kobu-table"><tbody>' + rows + '</tbody></table></div>';
  }).join('');
}

function renderHenkakuQuiz() {
  var cards = HENKAKU_QUIZ.map(function(item, i) {
    var choices = item.choices.map(function(c, ci) {
      return '<button class="choice-btn" data-qi="' + i + '" data-ci="' + ci + '">' + c + '</button>';
    }).join('');
    return '<div class="q-card" id="hq-card-' + i + '">'
      + '<div class="q-number">Q' + (i + 1) + '</div>'
      + '<div class="q-text">' + item.q + '</div>'
      + '<div class="choices" id="hq-choices-' + i + '">' + choices + '</div>'
      + '<div class="q-feedback" id="hq-fb-' + i + '"></div>'
      + '</div>';
  }).join('');
  return '<div class="acc-lead">🎯 答えを選ぶとすぐに正解と解説が出るよ。点数はつかないので、気軽に確認しよう。</div>' + cards;
}

function wireHenkakuQuiz() {
  document.querySelectorAll('.choice-btn[data-qi]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var qi = parseInt(btn.dataset.qi);
      var ci = parseInt(btn.dataset.ci);
      var item = HENKAKU_QUIZ[qi];
      var choicesWrap = document.getElementById('hq-choices-' + qi);
      var fb = document.getElementById('hq-fb-' + qi);
      var card = document.getElementById('hq-card-' + qi);
      if (choicesWrap.dataset.answered) return;
      choicesWrap.dataset.answered = '1';
      choicesWrap.querySelectorAll('.choice-btn').forEach(function(b, i) {
        b.disabled = true;
        if (i === item.answer) b.classList.add('show-correct');
      });
      var correct = ci === item.answer;
      if (correct) { btn.classList.add('selected-correct'); card.classList.add('correct-card'); }
      else { btn.classList.add('selected-wrong'); card.classList.add('wrong-card'); }
      fb.className = 'q-feedback ' + (correct ? 'correct-fb' : 'wrong-fb');
      fb.style.display = 'block';
      fb.textContent = (correct ? '◎ 正解！ ' : '✗ 惜しい。正解は「' + item.choices[item.answer] + '」。') + item.exp;
    });
  });
}

function render() {
  var html = '<div class="ref-intro">🐾 古文の動詞の中で、決まったパターンに当てはまらない「変格活用」だけを1ページにまとめた。数はたった9語だけなので、丸ごと覚えてしまうのが一番の近道。</div>';

  html += '<div class="ref-section-title">① 変格活用ひとめ表</div>';
  html += renderHenkakuTable();

  html += '<div class="ref-section-title">② 覚え方のコツ</div>';
  html += renderHenkakuMnemonic();

  html += '<div class="ref-section-title">③ 犬の例文で活用を見比べる</div>';
  html += '<div class="acc-lead">品詞早見表・古文まとめで使っている「あの犬」を使って、それぞれの活用形がどう変わるか見比べてみよう。</div>';
  html += renderHenkakuDog();

  html += '<div class="ref-section-title">④ かんたん問題</div>';
  html += renderHenkakuQuiz();

  html += '<div class="ref-actions">'
    + '<button class="print-btn" id="printBtn">🖨️ 印刷してデスクに貼る</button>'
    + '<a class="back-link" href="kobun_matome.html">← 古文まとめにもどる</a>'
    + '</div>';

  document.getElementById('refMain').innerHTML = html;

  wireHenkakuQuiz();

  var pb = document.getElementById('printBtn');
  if (pb) pb.addEventListener('click', function() { window.print(); });
}

render();
</script>
</body>
</html>
