<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国語｜品詞早見表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:   #0d1117;
  --bg2:  #161b22;
  --bg3:  #1c2230;
  --gold: #f5c518;
  --red:  #e94560;
  --teal: #0ea5e9;
  --green:#3fb950;
  --purple:#a371f7;
  --text: #e6edf3;
  --text2:#8b949e;
  --border:#30363d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  line-height: 2.0;
  letter-spacing: 0.04em;
}
.top-nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--purple); letter-spacing: 2px; flex-shrink: 0; }
.ref-main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
.ref-intro { background: var(--bg2); border: 1px solid var(--border); border-left: 4px solid var(--purple); border-radius: 12px; padding: 18px 20px; margin-bottom: 26px; font-size: 14px; line-height: 2.0; color: var(--text2); }
.ref-section-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); letter-spacing: 1.5px; margin: 32px 0 14px; }
.ref-section-title:first-of-type { margin-top: 0; }

.sentence-board { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 24px 20px; margin-bottom: 12px; }
.sentence-flow { display: flex; flex-wrap: wrap; gap: 10px 6px; align-items: flex-end; justify-content: center; }
.word-chip { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.word-chip .w-text { font-size: 20px; font-weight: bold; padding: 8px 14px; border-radius: 8px; color: #0d1117; white-space: nowrap; }
.word-chip .w-pos  { font-size: 11px; padding: 2px 9px; border-radius: 10px; color: #fff; font-weight: bold; letter-spacing: 0.5px; white-space: nowrap; }
.sentence-note { text-align: center; font-size: 12px; color: var(--text2); margin-top: 16px; }

.pos-table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
.pos-table { width: 100%; border-collapse: collapse; min-width: 640px; background: var(--bg2); font-size: 14px; }
.pos-table th { background: var(--bg3); color: var(--text2); font-size: 12px; letter-spacing: 0.5px; padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border); white-space: nowrap; }
.pos-table td { padding: 12px; border-bottom: 1px solid var(--border); line-height: 1.8; vertical-align: top; }
.pos-table tr:last-child td { border-bottom: none; }
.pos-table tr.group-divider td { border-top: 2px solid var(--gold); }
.pos-name-cell { display: flex; align-items: center; gap: 8px; font-weight: bold; white-space: nowrap; }
.pos-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.pos-tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 8px; color: #fff; font-weight: bold; white-space: nowrap; }
.pos-word-highlight { color: var(--gold); font-weight: bold; }

.flow-recap { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px; text-align: center; margin-top: 8px; }

.print-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; border: none; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-family: inherit; font-weight: bold; cursor: pointer; letter-spacing: 0.5px; }
.print-btn:hover { opacity: 0.88; }
.ref-actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0; align-items: center; }

@media print {
  body { background: #fff !important; color: #111 !important; }
  .top-nav, .print-btn, .ref-actions { display: none !important; }
  .ref-intro { background: #f3f3f3 !important; color: #333 !important; border-color: #ccc !important; }
  .sentence-board, .pos-table-wrap, .pos-table, .flow-recap { background: #fff !important; border-color: #999 !important; }
  .pos-table th { background: #eee !important; color: #333 !important; }
  .pos-table td { color: #111 !important; border-color: #ccc !important; }
  .word-chip .w-text { color: #111 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ref-section-title { color: #111 !important; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-title">🔖 品詞早見表</div>
</nav>

<div class="ref-main" id="refMain"></div>

<script>
var POS_COLORS = {
  '動詞':'#3fb950', '形容詞':'#f5c518', '形容動詞':'#f97316', '名詞':'#0ea5e9',
  '副詞':'#a78bfa', '連体詞':'#ec4899', '接続詞':'#2dd4bf', '感動詞':'#f43f5e',
  '助動詞':'#a371f7', '助詞':'#64748b'
};

var SENTENCE = [
  { text:'ああ、',   pos:'感動詞' },
  { text:'あの',     pos:'連体詞' },
  { text:'大きい',   pos:'形容詞' },
  { text:'犬',       pos:'名詞' },
  { text:'は',       pos:'助詞' },
  { text:'とても',   pos:'副詞' },
  { text:'静かだ。', pos:'形容動詞' },
  { text:'しかし',   pos:'接続詞' },
  { text:'全然',     pos:'副詞' },
  { text:'歩か',     pos:'動詞' },
  { text:'ない。',   pos:'助動詞' },
];

var POS_ROWS = [
  { pos:'動詞',   word:'歩か（歩く）', kind:'自立語', katsuyo:'する',   tip:'言い切りがウ段（歩く）。単独で述語になれる' },
  { pos:'形容詞', word:'大きい',       kind:'自立語', katsuyo:'する',   tip:'言い切りが「い」' },
  { pos:'形容動詞', word:'静かだ',     kind:'自立語', katsuyo:'する',   tip:'言い切りが「だ」。「〜な」の形で体言を修飾できる', groupEnd:true },
  { pos:'名詞',   word:'犬',           kind:'自立語', katsuyo:'しない', tip:'主語になれる（「犬が」の形にできる）', groupEnd:true },
  { pos:'副詞',   word:'とても・全然', kind:'自立語', katsuyo:'しない', tip:'主に用言（動詞・形容詞・形容動詞）を修飾する' },
  { pos:'連体詞', word:'あの',         kind:'自立語', katsuyo:'しない', tip:'体言だけを修飾する' },
  { pos:'接続詞', word:'しかし',       kind:'自立語', katsuyo:'しない', tip:'文と文、語と語をつなぐ' },
  { pos:'感動詞', word:'ああ',         kind:'自立語', katsuyo:'しない', tip:'それだけで独立語になる（感動・呼びかけ・応答）', groupEnd:true },
  { pos:'助動詞', word:'ない',         kind:'付属語', katsuyo:'する',   tip:'動詞「歩か」にくっついて意味を添える' },
  { pos:'助詞',   word:'は',           kind:'付属語', katsuyo:'しない', tip:'体言「犬」にくっついて関係を示す' },
];

var POS_FLOW_SVG = '<svg viewBox="0 0 340 300" style="width:100%;max-width:380px;display:block;margin:0 auto">'
  + '<rect x="10" y="10" width="320" height="46" rx="8" fill="rgba(163,113,247,0.12)" stroke="#a371f7" stroke-width="2"/>'
  + '<text x="170" y="30" fill="#a371f7" font-size="12" text-anchor="middle">① それだけで文節を作れる？</text>'
  + '<text x="170" y="46" fill="#8b949e" font-size="10" text-anchor="middle">YES→自立語　NO→付属語</text>'
  + '<path d="M 170,56 L 170,72" stroke="#8b949e" stroke-width="2" marker-end="url(#rArrow)"/>'
  + '<rect x="10" y="74" width="320" height="46" rx="8" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="2"/>'
  + '<text x="170" y="94" fill="#0ea5e9" font-size="12" text-anchor="middle">② （自立語なら）活用する？</text>'
  + '<text x="170" y="110" fill="#8b949e" font-size="10" text-anchor="middle">YES→用言（動詞･形容詞･形容動詞）</text>'
  + '<path d="M 170,120 L 170,136" stroke="#8b949e" stroke-width="2" marker-end="url(#rArrow)"/>'
  + '<rect x="10" y="138" width="320" height="46" rx="8" fill="rgba(245,197,24,0.12)" stroke="#f5c518" stroke-width="2"/>'
  + '<text x="170" y="158" fill="#f5c518" font-size="12" text-anchor="middle">③ （活用しないなら）主語になる？</text>'
  + '<text x="170" y="174" fill="#8b949e" font-size="10" text-anchor="middle">YES→名詞　NO→副詞･連体詞･接続詞･感動詞</text>'
  + '<path d="M 170,184 L 170,200" stroke="#8b949e" stroke-width="2" marker-end="url(#rArrow)"/>'
  + '<rect x="10" y="202" width="320" height="46" rx="8" fill="rgba(63,185,80,0.12)" stroke="#3fb950" stroke-width="2"/>'
  + '<text x="170" y="222" fill="#3fb950" font-size="12" text-anchor="middle">④ （付属語なら）活用する？</text>'
  + '<text x="170" y="238" fill="#8b949e" font-size="10" text-anchor="middle">YES→助動詞　NO→助詞</text>'
  + '<path d="M 170,248 L 170,264" stroke="#8b949e" stroke-width="2" marker-end="url(#rArrow)"/>'
  + '<rect x="10" y="266" width="320" height="30" rx="8" fill="rgba(233,69,96,0.10)" stroke="#e94560" stroke-width="1.5"/>'
  + '<text x="170" y="286" fill="#e94560" font-size="11" text-anchor="middle">用言の言い切り：動詞=ウ段／形容詞=い／形容動詞=だ</text>'
  + '<defs><marker id="rArrow" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L8,0 L4,7 Z" fill="#8b949e"/></marker></defs>'
  + '</svg>';

function renderSentenceBoard() {
  var html = '<div class="sentence-flow">';
  SENTENCE.forEach(function(w) {
    var color = POS_COLORS[w.pos];
    html += '<div class="word-chip">'
      + '<div class="w-text" style="background:' + color + '">' + w.text + '</div>'
      + '<div class="w-pos" style="background:' + color + '">' + w.pos + '</div>'
      + '</div>';
  });
  html += '</div>'
    + '<div class="sentence-note">この1つの文の中に、10品詞ぜんぶが登場している。同じ文で見比べると違いがつかみやすい！</div>';
  return html;
}

function renderPosTable() {
  var rows = '';
  POS_ROWS.forEach(function(r) {
    var color = POS_COLORS[r.pos];
    rows += '<tr' + (r.groupEnd ? ' class="group-divider"' : '') + '>'
      + '<td><div class="pos-name-cell"><span class="pos-dot" style="background:' + color + '"></span>' + r.pos + '</div></td>'
      + '<td class="pos-word-highlight">' + r.word + '</td>'
      + '<td><span class="pos-tag" style="background:' + (r.kind === '自立語' ? '#3fb950' : '#e94560') + '">' + r.kind + '</span></td>'
      + '<td>' + r.katsuyo + '</td>'
      + '<td>' + r.tip + '</td>'
      + '</tr>';
  });
  return '<div class="pos-table-wrap"><table class="pos-table">'
    + '<thead><tr><th>品詞</th><th>例文中の単語</th><th>自立語/付属語</th><th>活用</th><th>見分け方のポイント</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table></div>';
}

function render() {
  var html = '';
  html += '<div class="ref-intro">📖 品詞は毎回バラバラの例文で覚えると混乱しやすい。ここでは<strong style="color:var(--gold)">たった1つの例文</strong>を使い回して、10品詞の違いを一度に見比べられるようにしてある。迷ったらこのページに戻ってきて確認しよう。</div>';

  html += '<div class="ref-section-title">① 例文でぜんぶ見る</div>';
  html += '<div class="sentence-board">' + renderSentenceBoard() + '</div>';

  html += '<div class="ref-section-title">② 品詞対照表（同じ例文の単語で比較）</div>';
  html += renderPosTable();

  html += '<div class="ref-section-title">③ 見分け方フローチャート（おさらい）</div>';
  html += '<div class="flow-recap">' + POS_FLOW_SVG + '</div>';

  html += '<div class="ref-actions">'
    + '<button class="print-btn" id="printBtn">🖨️ 印刷してデスクに貼る</button>'
    + '</div>';

  document.getElementById('refMain').innerHTML = html;

  var pb = document.getElementById('printBtn');
  if (pb) pb.addEventListener('click', function() { window.print(); });
}

render();
</script>
</body>
</html>
